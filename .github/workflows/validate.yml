name: Validate n8n Workflows

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Validate JSON files
        run: |
          for file in *.json; do
            echo "Validating $file..."
            jq empty "$file" || exit 1
          done
          echo "All workflow files are valid JSON."
